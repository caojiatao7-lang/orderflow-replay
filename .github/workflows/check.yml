name: Source and synthetic demo
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-privacy.mjs
      - run: node scripts/generate-demo.mjs
      - run: npm test
